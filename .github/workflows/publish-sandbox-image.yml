# Publish this bundle's sandbox image to GHCR (fleet issue #195).
#
# Calls fleet's reusable publish workflow: builds sandbox/Containerfile with the
# canonical scripts/build-sandbox-image.sh and pushes an immutable {git-sha} tag
# plus :latest. The run summary prints the exact ref.
#
# Adopting a published image is a DELIBERATE deployment-side act — set
# FLEET_SANDBOX_IMAGE (or this manifest's sandbox.image) to the printed ref on
# the box, and fleet `podman pull`s it instead of rebuilding ~1.3 GB on-box.
# Leaving it unset keeps the build-on-box default, which is what this bundle
# ships. A registry image is also the only thing a future Kubernetes deployment
# can consume, since a scheduled pod has no on-box build step.
#
# This workflow used to end by opening a PR pinning sandbox.image here. That
# never once succeeded — GitHub Actions is not permitted to create pull requests
# in this org — so it was removed on 2026-08-20 along with the repo-write
# permissions it needed. See the header of fleet's reusable workflow.
#
# No image_name is passed. fleet derives the destination from this bundle's own
# manifest — basename of sandbox.tag under this repo's owner, lowercased — which
# is byte-identical to the string that used to be hand-written here. That string
# is how omnicom-config ended up publishing to fleet-sandbox-example, and an
# un-normalized ghcr.io/${{ github.repository_owner }}/... is additionally an
# invalid OCI reference for an owner with capitals. Neither is expressible now.
# Pass image_name only to target a non-GHCR registry (e.g. ECR).
#
# PACKAGE VISIBILITY follows the publishing repo here — measured, because
# GitHub's docs say something else (private by default, permissions but "not the
# visibility" inherited). Four packages in this org all took their repo's
# visibility, including a brand-new one pushed under observation.
#
# This repo is PUBLIC, so its package is publicly pullable — verified by a
# first-ever push on 2026-08-20 that needed no settings change. Nothing
# sensitive is in the image (no COPY/ADD in the Containerfile; it is Fedora plus
# RPMs) and the name discloses nothing, since this template is public anyway.
#
# A first publish of a NEW image name needs no manual package setup: the pushing
# repo creates and links it. An earlier version of this comment said otherwise —
# it was generalising from fleet's June 2026 failures, which were a different
# case (a pre-existing org package, ghcr.io/elcanotek/sandbox, not linked to the
# repo, hence permission_denied: write_package). Verify a new package's
# visibility after its first publish rather than assuming either way.
name: Publish sandbox image

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
  workflow_dispatch:

# A reusable workflow's permissions must be a subset of its caller's, so
# contents: read is granted for the checkout even though the GHCR push is the
# point. No repo-write scopes: this workflow does not commit or open PRs.
#
# COUPLED TO fleet main: this narrowed grant requires the post-2026-08-20
# reusable workflow. The older one requested contents: write +
# pull-requests: write for its pin-PR steps, and a callee asking for more than
# its caller granted fails the run before anything is built. If a publish here
# dies immediately with a permissions error, fleet's change has not reached
# main yet — that is the fix, not widening these scopes back.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ElcanoTek/fleet/.github/workflows/publish-sandbox-image.yml@main
