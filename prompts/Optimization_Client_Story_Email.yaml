name: Client-facing optimization story & budget pitch
description: Open the interactive Client Optimization Story Builder (show_ui) to craft a zero-jargon showcase email or run the 4-Test Spend Elasticity & Incremental Budget Evaluator.
goal: >
  Load the campaign's Optimization Log and delivery history, run the 4-Test
  Spend Elasticity & Incremental Budget Evaluator, and open the interactive
  Client Optimization Story Builder card (show_ui) to draft a brand-themed,
  jargon-free client update email with an embedded KPI chart.
inputs:
  required:
    - Campaign or client name (for example, DemandCo CMP00166)
  optional:
    - Preferred story archetype (Just Executed showcase, Proven 7-Day Lift readout, or Strategic Allocation & Incremental Budget Pitch)
    - Audience framing (Curation Partner Showcase or Agency / End-Client Buyer)
    - Recipient email address(es) (defaults to the trader's own email for review and forwarding)
instructions:
  - Follow skills/campaign-optimization-log/SKILL.md (Flow 3) and protocols/optimization-log-protocol.md (Section 7).
  - Load CampaignConfig.yaml, OptLog.csv, and recent DSP report data for the campaign, and compute the 4-Test Spend Elasticity & Incremental Budget evaluation.
  - Render the interactive Client Optimization Story Builder card via show_ui (skills/campaign-optimization-log/REFERENCE.md Blueprint 3).
  - When the user submits generate_story_email, generate the PNG chart using the palette in protocols/email-style.yaml (chart_colors), render the HTML email via mcp_ses_outbound_render_email, and stage mcp_ses_outbound_send_email with the rendered content_file and inline_attachments.
output:
  sections:
    - 4-Test Spend Elasticity and KPI lift readout
    - Interactive Client Optimization Story Builder card (show_ui)
    - Rendered HTML email and approval-gated send
