name: Client-facing optimization story & budget pitch
description: Open the interactive Client Optimization Story Builder (show_ui) to craft a zero-jargon showcase email or run the 4-Test Spend Elasticity & Incremental Budget Evaluator.
goal: >
  Load the campaign's Optimization Log and delivery history from its configured
  storage and report sources, run the 4-Test Spend Elasticity & Incremental
  Budget Evaluator, and open the interactive Client Optimization Story Builder
  card (show_ui) to draft a brand-themed, jargon-free client update email with
  an embedded KPI chart.
inputs:
  required:
    - Campaign or client name (for example, DemandCo CMP00166)
  optional:
    - Preferred story archetype (Just Executed showcase, Proven 7-Day Lift readout, or Strategic Allocation & Incremental Budget Pitch)
    - Audience framing (Curation Partner Showcase or Agency / End-Client Buyer)
    - Recipient email address(es) (defaults to the trader's own email for review and forwarding)
instructions:
  - Follow skills/campaign-optimization-log/SKILL.md (Flow 3) and protocols/optimization-log-protocol.md (Section 5).
  - Load CampaignConfig.yaml, OptLog.csv, and recent delivery report data for the campaign, and compute the 4-Test Spend Elasticity & Incremental Budget evaluation.
  - Render the interactive Client Optimization Story Builder card via show_ui (skills/campaign-optimization-log/REFERENCE.md Blueprint 3).
  - When the user submits generate_story_email, generate the PNG chart using the palette in protocols/email-style.yaml (chart_colors), and render/stage the email via the workspace's configured outbound email tool (or provide the rendered HTML/chart and client-safe .xlsx directly in chat if no outbound email connector is configured).
output:
  sections:
    - 4-Test Spend Elasticity and KPI lift readout
    - Interactive Client Optimization Story Builder card (show_ui)
    - Rendered HTML email and approval-gated send (or downloadable package)
