name: Onboard campaign to Optimization Log
description: Auto-discover DSP reports and SSP deals, run Day-1 Preflight QA, and open the interactive CampaignConfig Builder card (show_ui) to initialize CampaignConfig, OptLog, and OptTargets.
goal: >
  Onboard a campaign into the Campaign Optimization Log by discovering its DSP
  reports and SSP deals, running Day-1 Preflight QA, and opening the interactive
  CampaignConfig Builder card (show_ui) so the trader can confirm operating
  thresholds and save CampaignConfig.yaml, OptLog.csv, and OptTargets.csv.
inputs:
  required:
    - Client display name and campaign code (for example, DemandCo CMP00166)
    - Trader owner and notification email
    - Primary KPI and benchmark (or "no benchmark yet")
  optional:
    - Flight start and end dates (inferred from reports if omitted)
    - Per-channel KPI or benchmark overrides (Display, OLV, CTV)
    - Attached DSP report CSV/XLSX or mailbox filter hints
instructions:
  - Follow skills/campaign-optimization-log/SKILL.md (Flow 1) and protocols/optimization-log-protocol.md (Section 2).
  - Ask for any missing required campaign details or pre-fill them from the conversation and discovered DSP reports in mcp_explorer_*.
  - Run Day-1 Preflight QA on the discovered report columns and SSP deal mappings when available.
  - Render the interactive CampaignConfig Builder card via show_ui (skills/campaign-optimization-log/REFERENCE.md Blueprint 1) so the trader can review and confirm all campaign settings and eligibility thresholds before saving.
  - When the trader submits save_config or save_and_run, write CampaignConfig.yaml, OptLog.csv, and OptTargets.csv in the campaign's Optimizations/ directory (and run the initial Optimization Day scan immediately when save_and_run is selected), then explain how to schedule the weekday review runner with "Make recurring task…".
output:
  sections:
    - Auto-discovery and Day-1 Preflight QA summary
    - Interactive CampaignConfig Builder card (show_ui)
    - Saved file paths and recurring-task setup instructions
