# Example client bundle for the fleet app.
#
# fleet ships NO client-specific content. At boot it loads a *bundle* from the
# FLEET_CLIENT_CONFIG_DIR environment variable; this repo is a complete,
# generic example bundle you can fork as the starting point for your own.
#
# It is deliberately NOT about any one industry. "Northwind" is a fictional
# company used here only to show how white-label branding looks — rename it to
# yours. The example MCP server, personas, protocols, skills, and cards are
# written so any team running agents (support, ops, research, engineering,
# analytics) can see the shape and swap in their own.
#
# The full schema for every field below — ServerDef, Branding, Models,
# EmptyState, Sandbox, AgentPolicy, TaskTemplate, PersonaDef, HTTPToolDef,
# WebhookTriggerDef, ProviderDef, PricingConfig — and the enable-gate / ${VAR}
# interpolation semantics live in:
#   internal/clientconfig/clientconfig.go in the fleet repo
#   (https://github.com/ElcanoTek/fleet)
# A bundle is just this manifest plus the system_prompts/, personas/,
# protocols/, prompts/, skills/, plugins/, mcp/, evals/, and sandbox/ directories
# alongside it (fleet resolves each of those under the bundle root at load —
# see the Bundle struct's *Dir fields in clientconfig.go).
# fleet's manifest decoder is STRICT: an unknown or duplicate key fails the
# load at boot, so a typo'd key can never silently drop a policy.

# ── Branding (white-label) ──────────────────────────────────────────────────
# These strings are surfaced in the web UI and on the login screen. This is the
# whole white-label surface — change five lines and the app is yours.
branding:
  app_name: "Northwind"
  login_title: "Welcome aboard."
  login_tagline: "Sign in to your workspace and pick up where you left off."
  share_title: "Northwind — your team's AI workspace"
  share_description: "Persistent, multi-turn conversations with real tool use across your files, data, and the tools your team already uses."
  # The mark the navigation rail renders on every page. A bundle-relative path
  # to an .svg/.png/.webp/.jpg/.jpeg/.ico file, served straight from this bundle
  # (as /api/brand/logo), so changing it is a bundle change plus a restart — no
  # web rebuild, and nothing to copy into fleet. Drop the field and the rail
  # falls back to fleet's own mark. The path must stay inside the bundle and the
  # file must exist: fleet fails at startup on a bad value rather than rendering
  # a broken image on every page, so `fleet validate-config` catches a typo
  # before you restart into it.
  #
  # SHIPPED COMMENTED on purpose (2026-08-03). `logo` was added to the manifest
  # schema in fleet commit 2ac6ac1 (PR #886, merged 2026-07-29), and the
  # decoder is STRICT — on any fleet built before that commit an uncommented
  # `logo` is an unknown key that fails the whole bundle load at boot. fleet
  # has not cut a tagged release yet (`fleet version` reads the repo VERSION
  # file, still 0.0.0), so check the binary you actually run before
  # uncommenting: `git -C <fleet checkout> merge-base --is-ancestor 2ac6ac1
  # HEAD`, or grep its internal/clientconfig/clientconfig.go for `yaml:"logo"`
  # (the CHANGELOG "brand mark" entry and docs/BRANDING.md also mark the
  # feature). On a fleet at or past #886, uncomment:
  # logo: "assets/northwind-mark.svg"
  #
  # The OG unfurl card (og:image / twitter:image) that link scrapers render
  # when a deployment URL is pasted into Slack / iMessage / Discord / Teams. A
  # bundle-relative PNG/WebP/JPEG (1280x640 is conventional; SVG and ICO are
  # rejected at load because no unfurl scraper renders them). Validated at
  # startup exactly like `logo` and served from the bundle as
  # /api/brand/share-image; omit it and fleet's neutral generic card stands.
  # Same strict-decoder gate as `logo`, only newer: added in fleet commit
  # 1daf415 (PR #900) — uncomment only on a fleet at or past it (same
  # ancestor/grep check as above, against `yaml:"share_image"`).
  # share_image: "assets/northwind-share.png"
  # UI theme — a deliberately generic, unbranded monochrome palette (neutral
  # zinc + a restrained near-mono accent). Swap in your own brand colors.
  # Served as a render-blocking stylesheet so the shell (incl. login) paints
  # with no flash.
  #
  # Every token fleet themes is set below, on purpose: the defaults for the
  # structure/scrim/rail tokens are hand-tinted from fleet's OWN primary hue
  # rather than derived from yours, so a bundle that overrides only `primary`
  # keeps fleet-tinted emphasis borders and rail rows beside its palette. Start
  # from this complete block and the whole shell stays consistent.
  #
  # Semantic status colors (success / danger / warning) are intentionally not
  # themable — they encode meaning, not brand, so a failed tool call reads as
  # failure in every deployment.
  #
  # Values may be hex or rgb()/rgba()/hsl()/hsla(). Anything else, and any token
  # name fleet doesn't theme, is dropped at render time and that ONE token falls
  # back — a typo can't break the stylesheet. Light and dark are independent.
  colors:
    dark:
      # Core
      primary: "#A1A1AA"
      primary_hover: "#D4D4D8"
      # on_primary is the readable foreground ON a primary fill (buttons,
      # active segments, the user avatar). Fleet defaults it to white, so any
      # bundle with a LIGHT primary — like this gray — must declare a dark one
      # or primary buttons render white-on-light-gray (~1.8:1 contrast).
      on_primary: "#18181B"
      secondary: "#71717A"
      accent: "#E4E4E7"
      # Surfaces
      background: "#0B0B0D"
      surface_1: "#161618"
      surface_2: "#1F1F23"
      # Text
      text_primary: "#FAFAFA"
      text_secondary: "#C8C8CC"
      text_muted: "#8A8A90"
      text_disabled: "rgba(200, 200, 204, 0.45)"
      # Structure — border_strong is the emphasis edge (focus, active cards),
      # border_subtle the hairline between rows.
      border: "rgba(255, 255, 255, 0.14)"
      border_strong: "rgba(255, 255, 255, 0.28)"
      border_subtle: "rgba(255, 255, 255, 0.08)"
      # Scrims behind modals and overlays
      overlay_soft: "rgba(0, 0, 0, 0.20)"
      overlay_strong: "rgba(0, 0, 0, 0.40)"
      # Navigation-rail row states (a light wash on the rail surface)
      rail_hover: "rgba(255, 255, 255, 0.07)"
      rail_active: "rgba(255, 255, 255, 0.10)"
    light:
      primary: "#3F3F46"
      primary_hover: "#18181B"
      # Dark primary → white foreground reads fine; declared explicitly so the
      # example shows the token in both modes.
      on_primary: "#FFFFFF"
      secondary: "#52525B"
      accent: "#27272A"
      background: "#FAFAFA"
      surface_1: "#FFFFFF"
      surface_2: "#F1F1F3"
      text_primary: "#18181B"
      text_secondary: "#3F3F46"
      text_muted: "#71717A"
      text_disabled: "rgba(63, 63, 70, 0.45)"
      border: "rgba(0, 0, 0, 0.12)"
      border_strong: "rgba(0, 0, 0, 0.24)"
      border_subtle: "rgba(0, 0, 0, 0.07)"
      overlay_soft: "rgba(0, 0, 0, 0.12)"
      overlay_strong: "rgba(0, 0, 0, 0.32)"
      rail_hover: "rgba(0, 0, 0, 0.05)"
      rail_active: "rgba(0, 0, 0, 0.08)"

# ── Model defaults (advisory self-description ONLY) ────────────────────────
# HONESTY NOTE: fleet parses this block but does NOT consume it. Per the Models
# doc in internal/clientconfig/clientconfig.go, the field is retained only so
# the strict decoder still loads bundles that declare it — it is not a live
# model-selection knob and is never exposed to the web UI. The knobs that
# actually pick models:
#   - Scheduled tasks: the task's own `model` field, else the CUTLASS_TASK_MODEL
#     env var — a task with neither fails to dispatch
#     (internal/scheduledrun/scheduledrun.go). CUTLASS_TASK_FALLBACK_MODEL is
#     the retry tier.
#   - Chat: the picker default is compiled into the web app
#     (web/src/app/lib/modelAliases.ts DEFAULT_MODEL); the engine-side tiers
#     are the agentcore.DefaultCoreModel / DefaultMaxModel constants.
# Keep the values below in sync with what your deployment actually runs — as
# reviewer-readable documentation — or delete the block; both are safe.
models:
  default_core: "google/gemini-3.5-flash"
  default_max: "anthropic/claude-sonnet-4.5"

# ── Execution sandbox ───────────────────────────────────────────────────────
# Every agent tool call (bash, run_python, file I/O, MCP) runs inside this
# rootless container over a per-conversation workspace. The image is a per-bundle
# artifact: edit sandbox/Containerfile to add the tools your agents need. Default
# deploy builds it on the box; set FLEET_SANDBOX_IMAGE to pull a prebuilt image.
sandbox:
  containerfile: sandbox/Containerfile
  tag: localhost/fleet-sandbox-example:latest
  image: "${FLEET_SANDBOX_IMAGE:-}"
  # OCI runtime for `podman run --runtime=<value>`. Empty = podman's default
  # (rootless container, shared host kernel — no extra host setup). Set "kata"
  # or "libkrun" for hypervisor-level isolation (a dedicated microVM per tool
  # call; requires /dev/kvm). An explicit FLEET_SANDBOX_RUNTIME env var wins.
  runtime: "${FLEET_SANDBOX_RUNTIME:-}"
  # Default egress allowlist for NETWORKED sandboxes — consulted only when
  # FLEET_DEFAULT_NETWORK_MODE=allowlisted. Entries are exact domains or
  # "*."-prefixed wildcards; empty in allowlisted mode means deny all egress.
  # network_allowlist:
  #   - "pypi.org"
  #   - "files.pythonhosted.org"
  #   - "*.github.com"

# ── MCP server catalog ──────────────────────────────────────────────────────
# This is how you connect agents to your data and tools. Each entry declares a
# subprocess (or HTTP endpoint), an ENABLE GATE over env vars, and the env the
# subprocess gets — where ${VAR} resolves from the process environment at launch.
# Credential VALUES never live here, only the variable NAMES: fleet brokers the
# real secret host-side and injects it only when it runs a delegated MCP call, so
# it never enters the sandbox or the model's context.
# Connector entries may also map fleet-owned runtime tokens into the server's
# ordinary env contract: `${FLEET_WORKSPACE}` is a fleet-provided writable
# directory (`${FLEET_WORKSPACE}/inputs` is where a scheduled task's logical
# input names are materialized), and `${FLEET_TASK_ID}` is the current task
# UUID. These are resolved at spawn time, never from the operator environment —
# `example_api` below carries a live `${FLEET_WORKSPACE}` mapping.
#
# This bundle ships two working servers (plus one commented example) so you can
# see the shapes:
mcp_servers:
  # 1) An ALWAYS-ON server with no credentials — runs the moment fleet boots.
  #    A tiny "team knowledge base" over a bundled JSON handbook: the canonical
  #    "point an agent at your own docs" pattern. Swap mcp/data/handbook.json
  #    for your content (or rewrite the server to read your wiki / vector store).
  - name: knowledge_base
    type: stdio
    command: python3
    args: ["mcp/knowledge_base.py"]
    always: true
    display_name: "Team Knowledge Base"
    description: "Search and read a bundled company handbook. No credentials required."
    env:
      # Optional override for where the handbook JSON lives (documented in
      # mcp/knowledge_base.py). It must be mapped HERE to work at all: fleet
      # spawns stdio servers with a MINIMAL environment — PATH/HOME/locale plus
      # exactly this map (internal/mcp/client.go, NewStdioTransportInDir) — so
      # an operator `export HANDBOOK_PATH=…` never reaches the server on its
      # own. Unset resolves to "" and optional_env below drops the key, so the
      # server's built-in mcp/data/handbook.json default stands.
      HANDBOOK_PATH: "${HANDBOOK_PATH:-}"
    optional_env:
      - HANDBOOK_PATH
    # The declared canary for `fleet mcp test --deep` (fleet #854): ONE
    # read-only tool call that proves the server works end-to-end — here, that
    # the handbook actually loaded, one rung past the tools/list handshake.
    # The bundle author vets the call for side effects ONCE, right here; the
    # probe runner only ever executes what a manifest declares. Assertions are
    # deliberately minimal (`contains` on the first text block) because
    # asserting on live content makes probes flaky — prefer a shape-ish marker.
    # kb_list_categories takes no arguments and reads bundled JSON: the ideal
    # zero-side-effect canary.
    probe:
      tool: kb_list_categories
      contains: "category"

  # 2) A CREDENTIAL-GATED server — the host-side broker pattern. It registers but
  #    stays DARK until EXAMPLE_API_KEY is set in the environment, so a fresh
  #    checkout runs clean with no secrets. A generic REST connector: point
  #    EXAMPLE_API_BASE_URL at any JSON API and the key is brokered host-side.
  - name: example_api
    type: stdio
    command: python3
    args: ["mcp/example_api.py"]
    enabled_env: ["EXAMPLE_API_KEY"]
    account_vars: ["EXAMPLE_API_KEY"]
    display_name: "Example REST Connector"
    description: "A generic REST connector, gated on EXAMPLE_API_KEY. Demonstrates host-side credential brokering."
    env:
      EXAMPLE_API_KEY: "${EXAMPLE_API_KEY}"
      EXAMPLE_API_BASE_URL: "${EXAMPLE_API_BASE_URL:-https://api.example.com/v1}"
      EXAMPLE_API_TIMEOUT_SECONDS: "${EXAMPLE_API_TIMEOUT_SECONDS}"
      # ${FLEET_WORKSPACE} is a RESERVED runtime token, not an operator env var:
      # fleet substitutes a writable workspace directory at subprocess launch
      # (a fresh per-run dir for a scheduled task's dedicated client, a stable
      # per-deployment dir for shared spawns) and DROPS the key entirely on a
      # spawn path with no workspace to offer. The server therefore treats the
      # var as optional and degrades gracefully when it is unset — the same
      # posture as the optional_env keys below. Here the connector uses it to
      # write a local JSON receipt of each submitted record. See fleet
      # docs/MCP-BUNDLE-ENV.md for the full contract.
      EXAMPLE_API_OUTPUT_DIR: "${FLEET_WORKSPACE}/outputs"
      # Uncomment together with identity_env below (see its note first):
      # EXAMPLE_API_OWNER_ID: "${EXAMPLE_API_OWNER_ID}"
    optional_env:
      # Keys listed here are dropped from the spawned env when their resolved
      # value is EMPTY, so the server sees a clean "unset" instead of "" —
      # the degrade-gracefully pattern for optional configuration.
      - EXAMPLE_API_TIMEOUT_SECONDS
    # identity_env names the env keys that route IDENTITY or MONEY (owner /
    # member / marketplace-account ids, seat-routing tokens). fleet refuses a
    # named-account variant spawn when a listed key still holds its non-empty
    # default-seat value that the account's <VAR>_<ACCOUNT> overlay did not
    # override — suffixing the API key but not the owner id would otherwise
    # transact in the default client's seat under the named account's label.
    # The field is SAFE on any current fleet: it landed in commit e47544d
    # (2026-07-11) and the loader validates it at startup (stdio servers only;
    # every entry must name a key of this server's env map — a typo fails the
    # boot loudly instead of silently guarding nothing). It ships commented
    # here for one reason only: this placeholder connector never reads
    # EXAMPLE_API_OWNER_ID, and this template keeps env keys its servers do
    # not read out of the live map. When your real connector routes an
    # owner/account id, uncomment it together with the EXAMPLE_API_OWNER_ID
    # env line above.
    # identity_env: ["EXAMPLE_API_OWNER_ID"]

  # 3) An OPTIONAL, opt-in server — chat's per-conversation Optional-server
  #    semantics. `optional: true` keeps a connector out of conversations until
  #    a user switches it on (Settings → Connections); `enabled_by_default`
  #    picks the initial toggle state and `beta: true` badges it in the
  #    catalog. This one is also an HTTP MCP server rather than a stdio
  #    subprocess: fleet connects to `url`, and header ${VAR} secrets resolve
  #    HOST-SIDE — they never enter the sandbox or the model context. The
  #    `tools:` allowlist scopes the server to the named tools (absent = every
  #    advertised tool). Copy-paste ready: uncomment the block, point `url` at
  #    a real MCP endpoint, and set TICKETING_API_TOKEN.
  # - name: ticketing
  #   type: http
  #   url: "https://mcp.ticketing.example.com/mcp"
  #   headers:
  #     Authorization: "Bearer ${TICKETING_API_TOKEN}"
  #   enabled_env: ["TICKETING_API_TOKEN"]
  #   # Any-of gate alternative — enable when EITHER a token OR user+pass is set:
  #   # enabled_groups: [["TICKETING_API_TOKEN"], ["TICKETING_USER", "TICKETING_PASS"]]
  #   optional: true
  #   enabled_by_default: false
  #   beta: true
  #   display_name: "Ticketing (beta)"
  #   description: "Search and update tickets in the team tracker. Opt in per conversation."
  #   tools: ["ticket_search", "ticket_get", "ticket_update"]
  #   # Optional TLS hardening for an https server (CA pin / mTLS / SPKI pin):
  #   # tls:
  #   #   ca_cert: "/etc/fleet/ticketing-ca.pem"
  #   #   pinned_sha256: "<hex sha-256 of the server's SPKI>"

# ── Inline HTTP tools ───────────────────────────────────────────────────────
# A lightweight alternative to a full MCP server for simple "call this REST
# endpoint" tools: declare name + method + URL + an input JSON Schema inline —
# no subprocess required. The agent sees each entry as a native tool
# (mcp__http_<name>). Same credential boundary as mcp_servers: header ${VAR}
# secrets resolve HOST-SIDE at call time and never enter the sandbox or the
# model context. {param} tokens in `url` (percent-encoded) and `body_template`
# (JSON-escaped for JSON bodies) are filled from the model's input;
# `response_jq` (syntax-checked at load) filters a JSON response before the
# model sees it; `critical: true` opts the tool into the same audit/approval
# gate as agent_policy.critical_tools — use it for anything that writes.
#
# This bundle ships none. Copy-paste-ready examples (uncomment and adapt):
#
# http_tools:
#   - name: "get_ticket"
#     description: "Look up a ticket by ID and return its title, status, and description"
#     method: GET
#     url: "https://tracker.example.com/api/tickets/{ticket_id}"
#     headers:
#       Authorization: "Bearer ${TRACKER_API_TOKEN}"
#       Accept: "application/json"
#     input_schema:
#       type: object
#       properties:
#         ticket_id:
#           type: string
#           description: "Ticket ID (e.g. TCK-123)"
#       required: ["ticket_id"]
#     response_jq: "{title, status, description}"
#
#   - name: "post_announcement"
#     description: "Post an announcement message to the team feed"
#     method: POST
#     url: "https://chat.example.com/api/messages"
#     headers:
#       Authorization: "Bearer ${TEAM_CHAT_TOKEN}"
#       Content-Type: "application/json"
#     body_template: '{"channel": "{channel}", "text": "{message}"}'
#     critical: true   # a WRITE — held for audit/approval before it runs
#     input_schema:
#       type: object
#       properties:
#         channel: { type: string }
#         message: { type: string }
#       required: ["channel", "message"]

# ── Inbound webhook triggers ────────────────────────────────────────────────
# An external system (GitHub, Slack, CI) that presents a valid signature to
# POST /webhooks/{slug} starts a fresh conversation under notify_user, seeded
# from prompt_template rendered against the request payload. The turn runs
# through the SAME governed core as any chat turn. The trigger DEFINITION is
# bundle-author-trusted; the inbound PAYLOAD is untrusted input — it reaches
# the template only as data ({{.payload…}}). Set exactly ONE of
# hmac_secret_env (GitHub-style HMAC-SHA256) or token_secret_env (Slack v0
# signing secret); the env var names the secret, whose VALUE is read host-side
# and never enters the sandbox, the model, or the logs.
#
# This bundle ships none, so the endpoint rejects every call by default.
# Copy-paste-ready example (uncomment, set notify_user to a real user):
#
# webhook_triggers:
#   - slug: "github-pr-review"
#     description: "Review each pull request opened against our repos"
#     hmac_secret_env: GITHUB_WEBHOOK_SECRET   # value comes from .env, auto-allowlisted
#     hmac_header: "X-Hub-Signature-256"       # optional; this is the default
#     persona: "assistant"
#     model: "anthropic/claude-sonnet-4.5"     # optional; falls back to the server default
#     prompt_template: |
#       A pull request was opened: {{.payload.pull_request.title}}
#       URL: {{.payload.pull_request.html_url}}
#       Review it for correctness, security issues, and code quality.
#     notify_user: "you@example.com"           # required: whose conversation this creates

# ── LLM provider routing ────────────────────────────────────────────────────
# By default fleet routes EVERY model through OpenRouter (set OPENROUTER_API_KEY
# and you're done — no providers: block needed). Declare providers: to route
# specific model slugs natively to Anthropic / OpenAI / a self-hosted Ollama —
# for failover, data residency, or to avoid the OpenRouter markup. api_key_env
# names an env var; its VALUE is read host-side at boot and never enters the
# manifest, the sandbox, or the model context. Precedence per slug: explicit
# "<provider>/<model>" > first provider listing the slug > first catch-all.
# fallback_providers is an ordered cross-provider retry chain — provider names
# declared above — tried when the primary provider errors.
#
# This bundle ships none (single-OpenRouter default). Copy-paste-ready example:
#
# providers:
#   - name: openrouter          # catch-all: any slug not matched below
#     type: openrouter
#     api_key_env: OPENROUTER_API_KEY
#   - name: anthropic-direct    # route these slugs straight to Anthropic
#     type: anthropic
#     api_key_env: ANTHROPIC_API_KEY
#     models: ["claude-opus-4-8", "claude-sonnet-4-6"]
#   - name: local               # self-hosted Ollama (no key needed)
#     type: ollama
#     base_url: "http://localhost:11434/v1"
#     models: ["llama3.2", "qwen2.5-coder"]
#     # Provider-local context window (tokens) for budget accounting — must be
#     # positive when set. Worth declaring on self-hosted endpoints, whose
#     # limits fleet cannot discover; OpenRouter-routed slugs use OpenRouter's
#     # authoritative per-model metadata instead.
#     context_window_tokens: 32768
# fallback_providers: ["anthropic-direct", "openrouter"]

# ── Chat empty-state catalog ────────────────────────────────────────────────
# The quick-start cards on the chat home screen. The Go side passes each card to
# the browser verbatim as opaque JSON (shape = the web's ProtocolPill).
empty_state:
  cards:
    - id: "summarize"
      section: "Get started"
      type: "form"
      icon: "file-text"
      title: "Summarize a document"
      desc: "Paste or attach a document and get a concise, structured summary."
      cta: "Summarize"
      fields:
        - key: "focus"
          label: "What should the summary focus on?"
          type: "text"
          placeholder: "key decisions, action items, risks…"
      promptTemplate: "Summarize the attached/pasted document."
    - id: "analyze-data"
      section: "Get started"
      type: "conversation"
      optionalForm: true
      icon: "bar-chart"
      title: "Analyze a dataset"
      desc: "Attach a CSV and ask questions — I'll run Python in the sandbox to dig in."
      cta: "Start analysis"
      starterPrompt: "I'd like to analyze a dataset. Ask me what you need to know, then load it with Python and walk me through what stands out."
    - id: "ask-handbook"
      section: "Get started"
      type: "conversation"
      icon: "book-open"
      title: "Ask the handbook"
      desc: "Questions about policies, processes, or how we do things — answered from the knowledge base."
      cta: "Ask a question"
      starterPrompt: "Search the team knowledge base and answer my question, citing the article you used. My question: "
    - id: "draft"
      section: "Get started"
      type: "form"
      icon: "edit"
      title: "Draft something"
      desc: "An email, a plan, a snippet of code — describe it and I'll draft it."
      cta: "Draft it"
      fields:
        - key: "what"
          label: "What should I draft?"
          type: "text"
          required: true
          placeholder: "a kickoff plan for onboarding a new teammate…"
      promptTemplate: "Draft the following for me, and ask me anything you need first."
  protocol_pills: []

# ── Task templates ──────────────────────────────────────────────────────────
# Pre-filled scheduled-task configurations the Operations Center's task-create
# form offers as a starting point ("new task from a template"). Each `task`
# block mirrors the EDITABLE subset of the POST /tasks request: prompt, model,
# fallback_model, max_iterations, max_retries, recurrence, timezone, priority,
# allow_network, allow_delegation, instruction_self_improve, persona,
# description, tags, and the SLA hint (expected_duration_minutes +
# sla_warn_multiplier / sla_fail_multiplier). Omitted keys leave the form field
# at its own default. Security-/routing-sensitive knobs (mcp_selection,
# credential_allowlist, loop_config, worktree_config, trigger_type,
# allow_task_creation) are deliberately NOT templatable, so a shipped template
# can never silently widen a task's authority. A prompt may contain {variable}
# placeholders — the UI prompts for values before applying the template.
task_templates:
  - name: "Weekly Status Report"
    description: "Run the weekly-status protocol: gather inputs, compute honest metrics, write the report artifact."
    icon: "📊"
    task:
      prompt: |
        Run the "weekly-status" protocol: gather this week's inputs from the
        workspace, compute the metrics honestly in Python, and write the status
        report artifact. Flag anything that needs a human decision.
      model: "anthropic/claude-sonnet-4.5"
      persona: "analyst"
      recurrence: "0 16 * * 5"
      timezone: "America/New_York"
      max_iterations: 25
      tags: ["weekly", "report"]
      # SLA hint: surface a warning at 1.5x and a breach at 2x of this estimate
      # (the default multipliers; set sla_warn_multiplier / sla_fail_multiplier
      # to change them).
      expected_duration_minutes: 20
  - name: "Handbook Freshness Check"
    description: "Scan the team knowledge base for stale or contradictory articles."
    icon: "📖"
    task:
      prompt: >-
        Search the team knowledge base for articles that look stale, reference
        tools or processes we no longer use, or contradict each other. List
        each finding with the article title and what needs updating.
      model: "google/gemini-3.5-flash"
      fallback_model: "anthropic/claude-sonnet-4.5"
      max_iterations: 15
      tags: ["handbook", "hygiene"]
  - name: "Research Brief"
    description: "Web research on a topic, distilled into a cited brief (see protocols/research-report.md)."
    icon: "🔎"
    task:
      prompt: 'Run the "research-report" protocol on this topic and write the cited brief to the workspace: {topic}'
      model: "anthropic/claude-sonnet-4.5"
      persona: "analyst"
      allow_network: true
      max_iterations: 30
      tags: ["research"]

# ── Agent tool-behavior policy ──────────────────────────────────────────────
# How fleet governs the tools above. Read-only tools can be dispatched in
# parallel within one turn; "critical" tools (by bare name suffix) require an
# audit gate before they run. The generic send_email / send_template_email
# suffixes are always enforced by fleet — list only your own additions here.
agent_policy:
  parallel_safe_tools:
    - mcp_knowledge_base_kb_search
    - mcp_knowledge_base_kb_get_article
    - mcp_knowledge_base_kb_list_categories
    - mcp_example_api_api_get_record
    - mcp_example_api_api_list_records
  # `api_submit_record` is a WRITE — gated behind an audit confirmation. This is
  # how you make an agent stop and get sign-off before a consequential action.
  critical_tools:
    - submit_record
  critical_tool_substitutes: {}
  # Optional per-tool approval windows in SECONDS, keyed by the same bare
  # tool-name suffix as critical_tools. Highest-priority layer of the
  # approval-timeout chain (per-tool > per-conversation >
  # FLEET_APPROVAL_TIMEOUT_SECONDS > 300s default); an approval that times out
  # is DENIED. Omit the map to use the global default for every tool.
  critical_tool_timeouts:
    submit_record: 600   # give the reviewer time to read the record it will post

# ── Governed lifecycle hooks (fleet #788) ───────────────────────────────────
# Bundle-declared commands that run INSIDE the per-turn sandbox at fixed
# lifecycle points: user_prompt_submit, pre_tool_use, post_tool_use, turn_end.
# Each hook gets a bounded, secret-redacted JSON payload on stdin and prints a
# JSON decision on stdout ({"decision":"continue"|"block", "reason":...,
# "additional_context":...}). Hooks can only observe or NARROW a turn, never
# widen it — they run with no credentials and fleet's policy/approval/budget
# gates still evaluate afterwards on the same unmodified input (fleet
# docs/HOOKS.md + ADR-0038). Only pre_tool_use and user_prompt_submit can
# block. `enforce: true` makes a hook failure (nonzero exit / timeout /
# malformed output) BLOCK the operation; the default is advisory — a failure
# is audited and the operation proceeds. `matcher` (tool events only): "" or
# "*" = every tool, a trailing "*" is a prefix glob, anything else an exact
# tool name. `timeout_seconds` defaults to 30, clamped to [1,120].
# `version: 1` is required whenever entries exist, and ids must be unique.
# Hooks install at startup — changing them requires a restart.
#
# This bundle ships none (like fleet's own default bundle). Copy-paste-ready
# example (uncomment and adapt):
#
# hooks:
#   version: 1
#   entries:
#     - id: "block-secrets-in-bash"
#       event: pre_tool_use
#       matcher: "bash"
#       # stdin carries {"tool_input": "...", ...}; jq -e exits nonzero when
#       # the filter is false, which an enforced hook turns into a block.
#       command: "jq -e '.tool_input | test(\"AWS_SECRET\") | not'"
#       timeout_seconds: 15
#       enforce: true     # fail-closed: a match (or a hook crash) blocks the call
#     - id: "note-record-submits"
#       event: post_tool_use
#       matcher: "mcp_example_api_*"    # prefix glob over runtime tool names
#       command: "python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps({\"decision\":\"continue\",\"additional_context\":\"record submitted via \"+p.get(\"tool_name\",\"?\")}))'"
#       enforce: false    # advisory: a failure is audited, the turn proceeds

# ── Per-persona tool permissions (least-privilege by role) ──────────────────
# An optional NARROWING gate over which tools each persona may even see. It can
# only SUBTRACT from what the server/credential gates already permit, never
# add. `allow` non-empty = default-deny (only listed tools are offered); only
# `deny` = default-allow with exceptions; deny wins when both match. Patterns
# match the runtime tool name: `bash` (exact native tool), `mcp:server/tool`,
# `mcp:server/*`, `prefix/*`, `*`. The `name` matches the basename of a
# personas/<name>.yaml file; personas with no entry here (Aria the assistant,
# Atlas the analyst) keep the default and see every permitted tool.
personas:
  # Sage answers from the handbook — the onboarding guide never needs the REST
  # connector, so it never sees it. Deny-only keeps everything else (bash,
  # run_python, the kb_* tools) available.
  - name: onboarding-guide
    tool_permissions:
      deny:
        - "mcp:example_api/*"

# ── Custom model pricing ────────────────────────────────────────────────────
# Cost accounting normally trusts the USD figure OpenRouter returns per step.
# On negotiated/enterprise rates (or a private endpoint) declare per-model
# rates — per MILLION tokens — and fleet prices matching steps locally from the
# token counts instead, which also makes the cost ceiling reflect real spend.
# fallback: what to do for models NOT listed — "openrouter" (default: trust the
# returned cost) or "zero" (suppress cost; fully-private deployments).
#
# This bundle ships none. Copy-paste-ready example:
#
# pricing:
#   fallback: openrouter
#   overrides:
#     - model: "anthropic/claude-sonnet-4.5"
#       input_cost_per_million_tokens: 3.00
#       output_cost_per_million_tokens: 15.00
#       cache_read_cost_per_million_tokens: 0.30
#       cache_write_cost_per_million_tokens: 3.75

# ── Hosted MCP server directory (fleet #538 + built-in directory) ───────────
# Fleet embeds a large curated directory of hosted MCP servers in the binary
# (~290 entries, categorized, tagged, provenance-labeled), and this bundle
# inherits it automatically — the 60-entry copy that used to live here was
# deleted in favor of that built-in list. It is a LISTING only: nothing is
# contacted until a user explicitly connects a server through the per-user
# remote-MCP OAuth flow on Settings → Connections.
#
# Knobs (see fleet docs/MCP-CATALOG.md):
#   remote_mcp_catalog_builtin: false    # opt out of the built-in directory
#   remote_mcp_catalog_hidden: [name, …] # hide individual entries (also the
#                                        # kill switch for a dead endpoint)
#   remote_mcp_catalog: [ … ]            # bundle-authored entries; same-name
#                                        # entries override built-ins
#
# Community-provenance entries (hosted by identifiable maintainers who are not
# the service's vendor) are additionally opted IN for this bundle — the UI
# badges them and requires an operator-named consent step before connecting.
remote_mcp_catalog_community: true
# A bundle-authored entry is a DIRECTORY LISTING, not a connection: fleet never
# contacts the URL until a user adds the server from Settings → Connections.
# Same-name entries override built-ins. This bundle authors none; copy-paste
# ready example of the full entry shape (uncomment into the list below):
#
# remote_mcp_catalog:
#   - name: "acme-tracker"                # stable id, unique in the manifest
#     display_name: "Acme Tracker"
#     description: "Search and update Acme work items from chat."
#     url: "https://mcp.acme-tracker.example.com/mcp"   # https required
#     vendor: "Acme Software, Inc."       # who OPERATES the hosted endpoint
#     docs_url: "https://acme-tracker.example.com/docs/mcp"
#     repo_url: "https://github.com/acme/tracker-mcp"   # so users can vet it
#     category: "development"             # free-form kebab-case directory group
#     tags: ["tickets", "issues", "tracker"]
#     # provenance is the trust tier of the HOSTING OPERATOR: "official" (the
#     # service's own vendor hosts it), "third_party" (an identifiable company
#     # hosts access to OTHER vendors' services), or "community" (an
#     # identifiable maintainer who is neither). Absent defaults to official;
#     # the UI badges the tiers and gates non-official adds behind an
#     # operator-named consent step.
#     provenance: "official"
#     # auth is the UI hint for what connecting takes: "oauth" (sign in with
#     # the vendor), "api_key" (bring a key), "open" (no credentials), or
#     # "tenant" (the url carries a {placeholder} the user fills in).
#     auth: "api_key"
#     # api_key auth only: the HTTP header NAME the vendor expects the key
#     # under; empty means the default "Authorization: Bearer <key>" shape.
#     # (Newer fleets — commit 5d47c0b / #901 — also accept api_key_query for
#     # vendors that take the key as a URL query parameter.)
#     api_key_header: "X-Api-Key"
#     # oauth auth only: set client_registration: "manual" when the vendor's
#     # authorization server lacks RFC 7591 dynamic client registration — the
#     # add form then collects a client ID (+ optional secret) up front.
#     # setup_hint renders VISIBLY on the directory card — where the key or
#     # URL comes from, what must exist first. setup_url links the vendor page
#     # that walks through it (the UI falls back to docs_url when absent).
#     setup_hint: "Create an API key under Acme Tracker → Settings → API."
#     setup_url: "https://acme-tracker.example.com/docs/api-keys"
#     featured: true    # surfaces it on the directory's short Featured shelf
remote_mcp_catalog: []

# ── Agent Skills knobs ──────────────────────────────────────────────────────
# fleet embeds a built-in Agent Skills pack that every bundle inherits
# alongside its own skills/ dir (a bundle skill with the same name wins — see
# fleet docs/SKILLS.md). Opt out or trim:
#   skills_builtin: false     # bundle skills only
#   skills_hidden: [name, …]  # drop individual built-in skills

# ── Evals ───────────────────────────────────────────────────────────────────
# Not a manifest key — golden regression sets live in this bundle's evals/
# directory (one YAML file per set; see evals/example.yaml). Replay + gate them
# with `fleet eval run <set>`, and grow them from real runs with
# `fleet eval capture`. See fleet docs/EVALS.md.
