# Campaign config template — Optimization Log Protocol v3.0.
# Ask in chat: "onboard <Client> <CampaignCode> to the optimization log"
# (or pick "Onboard campaign to Optimization Log" from the Prompt Library)
# to launch the interactive show_ui Campaign Config Builder card.
#
# A campaign can run on several DSPs. Each entry under `dsps` has its own
# reports and KPI. Each full review proposes every opt that passes
# cycle.min_sample and either cycle.materiality test, capped at
# cycle.max_new_opt_groups_per_run per run (zero is valid).

schema_version: "3.0"

storage:
  type: shared                # shared (recommended) | fastio | workspace
  workspace_id: null          # optional Fast.io workspace ID when type == "fastio"
  folder_path: "shared/Optimizations" # shared/Optimizations (recommended) or /Optimizations in Fast.io

campaign:
  client: <Client display name>
  client_short_name: <ClientShortNameNoSpaces>
  campaign_code: <CMP#####>
  curator: <default | partner_seat>
  partner: <Optional partner name>
  agency: <Optional agency name>
  opt_id_prefix: <XX>         # 2-4 letters; IDs are shared across DSPs (XX-001, XX-002.1 ...)
  start_date: <YYYY-MM-DD>
  end_date: <YYYY-MM-DD>
  active: true                # false = skipped by every review (auto-flipped to false after end-of-flight wrap)

team:
  # Emails route strictly to the trader listed in digest_to (grouped per trader on Optimization Days).
  trader: <Trader full name>
  digest_to: <trader@example.com>     # internal only, never a client address
  cc: []                              # optional standing internal CC emails
  backup_trader: null                 # optional backup trader email during PTO handoff
  backup_until: null                  # optional ISO date (YYYY-MM-DD) when backup_trader coverage expires and auto-clears
  optimization_days: [<TUE>]          # Optimization Days (MON-FRI): go-live, results, new opts, email
  light_days: [<THU>]                 # optional mid-week check (go-live, results, pacing guardrails; emails ONLY if something changed)

levers:                       # the ONLY levers the review may recommend
  ssp_direct:                 # we implement on our SSP deals (staged from the chat Workbench via Deal Planner)
    - domain_block_list
    - domain_allow_list
    - deal_targeting
    - daypart
    - geo_targeting
    - device_os_browser_targeting
  client_request:             # proposed to the client; they implement in the DSP
    - bid_adjustment
    - budget_shift_between_line_items
    - budget_shift_between_insertion_orders
  prohibited: []

ssp_constraints: {}           # optional platform limits

dsps:
  - id: <DV>
    name: <DV360>
    source:
      type: mailbox           # mailbox | fastio | s3
      path: <Folder/With/Date/Partitions>
      fallback: mailbox       # optional; used if today's partition is missing
    mailbox: <reports@example.com>
    sender_contains: <sender>
    deal_field: <report column holding the deal name>
    delivery: attachment      # attachment | download_link
    types:                    # subject keyword -> report type
      overall: "<subject keyword>"
      domain:  "<subject keyword>"
      geo:     "<subject keyword>"
      time_of_day: "<subject keyword>"
      system:  "<subject keyword>"
    notes: >
      <Drop cadence, rolling window, filename/subject quirks verified during Day-1 Preflight QA.>
    kpi:
      primary:
        name: <ROAS | CTR | CPA | VCR | Viewability ...>
        formula: "<ratio of sums with NULLIF>"
        benchmark: <target value>   # standard: captured from trader at onboarding (e.g. 0.08 for 0.08% CTR or 33.0 for 33x ROAS)
        channel_benchmarks: {}      # optional per-channel benchmark overrides, e.g. {Display: 0.08, OLV: 0.25}
        baseline: null              # fallback only: computed from latest report window ONLY when benchmark is null
        direction: higher_is_better # or lower_is_better
        status: active              # active | blocked (add unblock_check) — no Proposed rows until active
      channel_kpis: {}              # optional per-channel KPI override, e.g. {OLV: {name: VCR, formula: "...", benchmark: 75.0, direction: higher_is_better}}
      secondary: []                 # optional
      guardrail_metrics: []         # optional
      no_conversion_tracking: false # true = never report ROAS/CPA for this DSP

cycle:
  materiality:                # an opt qualifies if it meets EITHER test
    min_addressable_spend_share: 0.10
    min_projected_kpi_change: 0.05
  min_sample:                 # below this a segment is not actionable
    impressions: 1000
    spend_usd: 25
  max_new_opt_groups_per_run: 5
  max_deal_volume_cut_share: 0.40   # >40% impression/spend removal triggers a Scale Warning in Notes + Workbench
  prefer_unused_reports_on_tie: true
  auto_detect_live: true
  low_spend_lookback_days: 28
  evaluation_days: 7

files:
  opt_log: OptLog_<ClientShortName>_<CMP#####>.csv
  opt_targets: OptTargets_<ClientShortName>_<CMP#####>.csv

state:                        # maintained automatically by the scheduled review runner & chat Workbench
  last_optimization_run: null # ISO date of last completed Optimization Day run
  last_light_review: null     # ISO date of last completed light review
  carried_over: false         # true if deferred by the 5-campaign-per-run cap
  carried_over_run_type: null # "full" | "light" | "closeout" — preserves exact deferred run type so a light check isn't promoted to a full run
  wrap_completed: false       # true once the post-end_date closeout wrap email has been sent

ssp_seats:                    # maps each SSP on this campaign to its Fleet credential seat
  Index Exchange:
    seat: <default | partner_seat>
    connector_label: <Index Exchange>
    mcp_prefix: <mcp_indexexchange_mcp>
    account_id: <account_id>

deals:                        # maps exact DSP report deal_field names to SSP Deal IDs & URLs
  "<Exact Deal Name in DSP Report>":
    ssp: <Index Exchange | Magnite DV+ | OpenX | PubMatic | TripleLift>
    seat: <default | partner_seat>
    dsp: <DV360 | Amazon DSP>
    channel: <Display | OLV | CTV | Native>
    deal_id: <Buyer-facing Deal ID, e.g. IX...>
    internal_deal_id: <SSP internal ID or null>
    deal_url: <https://... direct SSP console link>
    optimization_block_list_id: null # optional: campaign-dedicated list ID on Magnite DV+ (<Client>_<CMP#####>_Optimization_Block_List)
