# Campaign config template — Optimization Log Protocol v3.0.
# Ask in chat: "onboard <Client> <CampaignCode> to the optimization log"
# (or pick "Onboard campaign to Optimization Log" from the Prompt Library)
# to launch the interactive show_ui Campaign Config Builder card.

schema_version: "3.0"

storage:
  type: <workspace | connected_storage | custom> # where CampaignConfig, OptLog, and OptTargets are stored
  backend: <null | optional connected storage / drive / bucket name>
  folder_path: "Optimizations"                   # folder or path in the chosen storage location

campaign:
  client: <Client display name>
  client_short_name: <ClientShortNameNoSpaces>
  campaign_code: <CMP#####>
  curator: <default | seat_name>
  partner: <Optional partner name>
  agency: <Optional agency name>
  opt_id_prefix: <XX>         # 2-4 letters; IDs are shared across DSPs (XX-001, XX-002.1 ...)
  start_date: <YYYY-MM-DD>
  end_date: <YYYY-MM-DD>
  active: true                # false = skipped by scheduled reviews

team:
  trader: <Trader full name>
  digest_to: <trader@example.com>     # internal notification recipient
  cc: []                              # optional standing internal CC emails
  backup_trader: null                 # optional backup trader email during PTO handoff
  backup_until: null                  # optional ISO date (YYYY-MM-DD) when backup_trader expires
  optimization_days: [<TUE>]          # Optimization Days (MON-FRI): go-live, results, new opts, notification
  light_days: [<THU>]                 # optional mid-week check (notifies only if something changed)

levers:                       # allowed optimization levers for this campaign
  ssp_direct:
    - domain_block_list
    - domain_allow_list
    - deal_targeting
    - daypart
    - geo_targeting
    - device_os_browser_targeting
  client_request:
    - bid_adjustment
    - budget_shift_between_line_items
    - budget_shift_between_insertion_orders
  prohibited: []

ssp_constraints: {}           # optional platform or seat limits

dsps:
  - id: <DSP_ID>
    name: <DSP Name>
    source:
      type: <mailbox | connected_feed | uploaded_file> # report inbox, connected data/storage feed, or uploaded files
    mailbox: <reports@example.com or null>
    feed_source: <optional connected feed / bucket / table identifier or null>
    deal_field: <report column holding the deal name>
    types:
      overall: "<keyword or pattern>"
      domain:  "<keyword or pattern>"
      geo:     "<keyword or pattern>"
      time_of_day: "<keyword or pattern>"
      system:  "<keyword or pattern>"
    notes: >
      <Drop cadence, rolling window, or column notes verified during Day-1 Preflight QA.>
    kpi:
      primary:
        name: <ROAS | CTR | CPA | VCR | Viewability ...>
        formula: "<ratio of sums with NULLIF>"
        benchmark: <target value or null>
        channel_benchmarks: {}      # optional per-channel overrides, e.g. {Display: 0.08, OLV: 0.25}
        baseline: null              # computed from initial report window when benchmark is null
        direction: higher_is_better # or lower_is_better
        status: active              # active | blocked
      channel_kpis: {}              # optional per-channel KPI override
      no_conversion_tracking: false

cycle:
  materiality:
    min_addressable_spend_share: <trader_confirmed_fraction, e.g. 0.10>
    min_spend_usd: <trader_confirmed_usd, e.g. 50>
    min_projected_kpi_change: <trader_confirmed_fraction, e.g. 0.05>
  min_sample:
    impressions: <trader_confirmed_int, e.g. 1000>
    spend_usd: <trader_confirmed_usd, e.g. 25>
  max_new_opt_groups_per_run: 5
  max_deal_volume_cut_share: <trader_confirmed_fraction, e.g. 0.40>
  auto_detect_live: true
  low_spend_lookback_days: 28
  evaluation_days: 7

files:
  opt_log: OptLog_<ClientShortName>_<CMP#####>.csv
  opt_targets: OptTargets_<ClientShortName>_<CMP#####>.csv

state:
  last_optimization_run: null
  last_light_review: null
  carried_over: false
  wrap_completed: false

ssp_seats:                    # maps each SSP chosen for this campaign to its seat metadata
  "<SSP Name>":
    seat: <default | seat_name>
    account_id: <optional account or seat ID>

deals:                        # keyed by "<dsp_id>::<Exact Deal Name in Report>" (or "<Exact Deal Name>" on single-DSP campaigns)
  "<dsp_id>::<Exact Deal Name in Report>":
    ssp: <SSP name>
    seat: <default | seat_name>
    dsp: <DSP name>
    channel: <Display | OLV | CTV | Native | Audio ...>
    deal_id: <Buyer-facing Deal ID>
    deal_url: <https://... optional console link or null>
