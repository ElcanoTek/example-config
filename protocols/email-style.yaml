---
name: Email Style Guide
description: >
  Component library for HTML email rendering. The canonical_template below
  is the single source of truth — mirrored from the email design system.
  It is a PATTERN REFERENCE showing reusable components. The workflow (MAP YAML)
  decides WHICH sections appear; this file decides HOW they look.

# =============================================================================
# RULES
# Seven non-negotiable rules. Everything else is guidance.
# =============================================================================

rules:
  - "SHOULD build the email with the ses_outbound render_email tool: pass the
    content as ordered blocks (text, headline_metrics, metrics, callout,
    table, chart, cta, closing) plus output_dir (or output_file when the
    workflow specifies an exact body_html_path), then call send_email with
    the content_file it returns. render_email supports tables up to 10
    columns (automatically compacting 6-10 column tables on desktop and
    stacking every row into labeled cards on mobile), headline_metrics strips
    of 1-6 KPI cards (with optional subtext, tone, and caption), bullet lists
    in text/callout blocks, and automatic brand-logo sizing. It applies this
    file's template, components, theme and cleanup rules for you, so the
    rest of this file is reference for the rare section no block covers.
    Never paste or re-type the rendered HTML."
  - "MUST send branded HTML (content_type='text/html') built on the
    canonical_template frame. send_email refuses HTML without the frame (the
    email-container table with its header and footer: EB001), whatever is
    inside it. The one exception is a deliberately unbranded note, such as a
    short personal reply: send it as plain text (content_type='text/plain'),
    never as bare HTML."
  - "MUST build every email from canonical_template. Copy the fixed sections
    verbatim and use the pattern sections as building blocks for whatever
    the workflow requires (see components table below)."
  - "MUST NOT include the template's example data in sent emails. Names like
    'Example US Video', dollar amounts like '$589,075.45', etc. exist only to
    demonstrate the HTML pattern."
  - "MUST strip all HTML comments (<!-- ... -->) before sending."
  - "MUST remove every data-preview=\"...\" attribute before sending, including
    the ones on the header cells copied verbatim. They mark the template's
    demo rows; validate_email_content rejects any that survive (EL101)."
  - "MUST NOT inline new colors or CSS. Use theme color_overrides only."
  - "MUST keep the Outlook fallbacks intact when copying or extending the template: every <td>/<th>/<table> that sets an inline background-color also carries a bgcolor attribute with the IDENTICAL hex, and no cell's INLINE style uses a single-side CSS border (border-left/right/top/bottom) — stripes and hairlines are filled rows/cells, as shipped. The per-side borders inside the mobile @media block are correct and MUST stay: Word strips the <style> block entirely, and EO002 inspects inline styles only. validate_email_content reports drift as EO001/EO002 WARNINGS; the shipped template and components lint clean, so a warning means the copy drifted — fix the copy, do NOT redesign or regenerate the template to chase it."
  - "MUST copy the COMPLETE @media CSS block including ALL mobile rules.
    Omitting any rule breaks mobile table stacking."
  - "MUST NOT fabricate images. Every <img> src MUST be either (a) a
    cid: reference with a matching entry in inline_attachments (the
    workflow supplies the file), or (b) an https:// URL to a real,
    reachable asset. data: URIs, inline SVG, file:// paths, and empty
    src values are FORBIDDEN. The only logo is the header's
    cid:brand-logo, which render_email supplies from the bundle; any
    other image added by the agent without a corresponding asset renders
    as a broken icon in the recipient's client. The
    ses_outbound send_email tool rejects sends that violate this rule."
  - "Every <td> in a data-table <tbody> MUST contain a mobile-label span:
    <span class=\"mobile-label\" style=\"display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;\">ColumnHeader</span>.
    The multi-property hide (display:none + font-size:0 + line-height:0 +
    max-height:0 + overflow:hidden) keeps the label invisible even when a
    forwarding path or sanitizer strips one declaration; the @media block
    restores all five with !important so the reveal is atomic. Without the
    span, stacked cells on mobile have no context. The mobile-label
    text MUST match the visible <th> for that column — and both MUST be
    dimensional, not generic. Use the dimension the column actually
    represents (e.g. Campaign, Channel, Geo, Device, Date) — never a
    placeholder noun like 'Metric', 'KPI', 'Item', or 'Field'. Generic
    nouns read as tautological next to self-describing row identities
    (e.g. 'Metric: DSP Spend' on a stacked mobile row), which defeats the
    purpose of the label. If the workflow truly has nothing dimensional to
    label the first column with, redesign the table so the values that need
    disambiguation are not in the first column."
  - "MUST NOT append a bare <div>, <p>, <h1>, <h2>, <h3>, <ul>, <a>,
    <span>, or a free-form <table> directly between component <tr> rows
    of the canonical_template's `<table class=\"email-container\">`.
    Every section that lives in that container must be a <tr> — when
    you need to add a custom section (opening prose, an extra
    sub-heading + paragraphs, a one-off table), wrap the contents in
    `<tr><td class=\"body-pad\" style=\"padding:20px 28px 0 28px;\">…</td></tr>`
    using the same body-pad style the canonical_template uses for its
    own rows. HTML5 parsers FOSTER-PARENT invalid table children
    (everything except <tr> / <thead> / <tbody> / <tfoot> / <caption> /
    <colgroup>) OUTSIDE the table — typically hoisted above the dark
    Victoria header, even though your source has it lower down. The
    ses_outbound validate_email_content tool rejects sends that violate
    this rule."
  - "MUST set a hard HTML width attribute on every <img> inside
    email-container (e.g. `width=\"544\"`). Outlook desktop (Word
    engine) ignores `style=\"max-width:100%\"` on images, so a wide
    PNG renders at its native pixel size and pushes the layout past
    the 600px container — this is the #1 cause of recipients having
    to scroll horizontally to see the data. The container is 600px
    with 28px horizontal body-pad, so the safe inline width is 544.
    Render the source PNG at 2× (1088px) for retina sharpness and
    let the width attribute lock the displayed size. See
    `chart_image_html` below for the full pattern."
  - "MUST set `table-layout:fixed` on every desktop `.data-table` (in
    the inline `style=`, not only in the @media block) AND give every
    `<th>` an explicit `width=\"X%\"` whose values sum to 100. Without
    fixed layout the longest cell in any column forces the column
    wider, breaking the 600px container. Every `<td>` whose content
    could be a long string (advertiser, agency, campaign, deal_id)
    MUST also carry `word-break:break-word` (or
    `overflow-wrap:anywhere`) inline so wrapping happens inside the
    fixed column rather than busting it open. The mobile @media block
    reverts to display:block per cell, so the fixed widths only apply
    on desktop where they are needed."
  - "SHOULD keep desktop data tables to ≤ 5 visible columns. With 6
    columns at 600px each cell drops below ~85px usable width and any
    multi-word string wraps to 3+ lines, which is what produced the
    \"too wide / sloppy\" look. If a workflow truly needs more than 5
    columns, either (a) split into two tables (e.g. \"Performance\"
    and \"Efficiency\"), or (b) demote the lowest-value column to the
    Optional Detail Appendix. NEVER reintroduce horizontal scroll by
    forcing 6+ columns into the desktop view."
  - "Financial column-order convention: dimensional columns
    (Campaign / Advertiser / Agency / Channel …) → Spend ($) → Revenue
    ($) → Margin ($) → Margin % → Share of Total → other ratios.
    **Spend ALWAYS appears before Margin.** This matches how traders
    and execs read a P&L — Spend is the input, Margin is the output.
    Reversing the order reads as a margin-first/spend-buried framing
    that operators consistently flag in review."
  - "Chart/image cards rendered via `cid:` reference MUST follow the
    sizing contract: source PNG = 1088×N (where the agent's natural
    aspect ratio determines N, capped at 480px tall); HTML render
    width = 544; HTML `width=\"544\"` attribute MUST be present;
    `style=\"display:block; max-width:100%; height:auto;\"` lets
    mobile clients scale down. Charts MUST be drawn with
    `bbox_inches='tight'` (matplotlib) so axis labels are not clipped,
    and the x-axis tick locations MUST be set explicitly from the
    underlying data points (`ax.set_xticks(data_dates)`) rather than
    relying on an auto-locator — otherwise dates drift out of
    alignment with their markers, which reads as \"sloppy\"."

# =============================================================================
# COMPONENTS
# Each row maps a template section (marked by an HTML comment like
# <!-- HEADER -->) to its usage rule. The template IS the component library.
# =============================================================================
#
#   Component          | Usage    | Notes
#   -------------------|----------|---------------------------------------------
#   HEAD + outer       | verbatim | <head>, MSO conditionals, @media CSS, body
#   structure          |          | wrapper, email-container table.
#   -------------------|----------|---------------------------------------------
#   HEADER             | verbatim | Dark branded header: Victoria kicker and
#                      |          | date, logo + client name, then a short
#                      |          | headline and the period. Substitute
#                      |          | {{placeholders}} but keep HTML structure.
#                      |          | Hand-built: delete the LOGO cell (only
#                      |          | render_email supplies the logo file).
#   -------------------|----------|---------------------------------------------
#   STATUS BAR         | verbatim | Badge + inline status. Substitute
#                      |          | {{placeholders}} but keep HTML structure.
#                      |          | MUST close the inner <table> before body
#                      |          | rows — omitting </table></td></tr> here
#                      |          | nests ALL body content inside a 2-col
#                      |          | table, creating a blank gap on the right.
#   -------------------|----------|---------------------------------------------
#   BODY content       | pattern  | Padding, font, color styles. Adapt text
#                      |          | freely for any prose section.
#   -------------------|----------|---------------------------------------------
#   METRICS CARD       | pattern  | Bordered off-white card for key figures.
#                      |          | Repeat or omit as needed.
#   -------------------|----------|---------------------------------------------
#   HEADLINE METRICS   | pattern  | Large-number KPI card (see separate
#                      |          | headline_metrics_html below — not in the
#                      |          | template's example arrangement).
#   -------------------|----------|---------------------------------------------
#   RISK CALLOUT       | pattern  | Orange-accent bordered box for warnings.
#                      |          | Repeat or omit as needed.
#   -------------------|----------|---------------------------------------------
#   OPPORTUNITY CALLOUT| pattern  | Green-accent bordered box for upside.
#                      |          | Repeat or omit as needed.
#   -------------------|----------|---------------------------------------------
#   DATA TABLE         | pattern  | thead/tbody with zebra rows and
#                      |          | mobile-label spans. Add/remove columns
#                      |          | (≤ 5 desktop cols). MUST include
#                      |          | table-layout:fixed and width="X%" on
#                      |          | every <th> (sum to 100). Repeat for
#                      |          | multiple tables.
#   -------------------|----------|---------------------------------------------
#   CHART IMAGE        | pattern  | Kicker + centered <img> with hard
#                      |          | width="544". See chart_image_html below.
#                      |          | Source PNG MUST be 1088×N (2× retina).
#   -------------------|----------|---------------------------------------------
#   SHARE-OF-TOTAL BAR | pattern  | In-cell horizontal bar + numeric label
#                      |          | for proportional values inside a data
#                      |          | table. See share_of_total_bar_html below.
#   -------------------|----------|---------------------------------------------
#   CTA                | optional | Bulletproof VML + table button. Include
#                      |          | ONLY when the workflow defines a CTA.
#                      |          | NEVER auto-fill cta_url with invented URLs.
#   -------------------|----------|---------------------------------------------
#   CLOSING            | pattern  | Next-steps / outlook prose block.
#                      |          | Adapt text freely.
#   -------------------|----------|---------------------------------------------
#   FOOTER             | default  | "Generated by Victoria". Include as-is by
#                      |          | default. MAY be customized when the workflow
#                      |          | or operator explicitly requests changes.
#   -------------------|----------|---------------------------------------------
#
# Usage key:
#   verbatim  — MUST copy HTML structure exactly (substitute {{placeholders}}).
#   pattern   — Use as a building block. Adapt content, repeat, reorder, or
#               omit to match the workflow's required sections.
#   optional  — Include only when the workflow explicitly requests it.
#   default   — Include as-is unless the workflow or operator overrides it.
#
# General guidance:
#   - Workflow section order ALWAYS wins over the template's example order.
#   - MAY add, remove, or reorder pattern sections freely.
#   - MAY repeat patterns (multiple tables, multiple callouts).
#   - Use the kicker style (12px uppercase #586F7C) for any section heading.
#   - MUST produce ONE HTML document — never render the template separately.

# =============================================================================
# PLACEHOLDERS
# Substitute these {{tokens}} in the HEADER and STATUS BAR.
# =============================================================================

placeholders:
  required:
    preheader_text: "Hidden inbox-preview text (40-100 chars)"
    date: "Header right side, ISO format e.g. 2026-04-09"
    client_name: "Header headline, beside the logo (the client's display name)"
    email_headline: "Header meta line: a short title for the email (2-6 words, no client name or dates), e.g. Weekly delivery review"
    date_range: "Header meta line, after the headline: the period the numbers cover (drop ' &middot; {{date_range}}' when there is none)"
    badge_label: "Status strip badge text"
    status: "Status strip inline text"
  optional:
    cta_url: "CTA button href — include ONLY when the workflow defines a CTA"
    cta_text: "CTA button label, max 25 chars — omit CTA block entirely if no CTA"

# =============================================================================
# HEADLINE METRICS (supplemental component — not in canonical_template)
# Use for prominent topline KPIs: total spend, margin, WoW deltas.
# Larger and bolder than the standard metrics card. 3-5 KPI rows max.
# =============================================================================

headline_metrics_html: |
  <tr>
    <td class="body-pad" style="padding:20px 28px 0 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F6FB" style="width:100%; border-collapse:collapse; background-color:#F4F6FB; border:1px solid #D7DEEE;">
        <tr>
          <td style="padding:16px 18px 8px 18px;">
            <h2 style="margin:0; font-size:12px; line-height:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#586F7C;">{{section_kicker}}</h2>
          </td>
        </tr>
        <tr>
          <td style="padding:0 18px 4px 18px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <!-- Repeat this row for each KPI (3-5 max) -->
              <tr>
                <td style="padding:6px 0; font-size:14px; line-height:20px; color:#586F7C; width:45%;">{{metric_label}}</td>
                <td style="padding:6px 0; font-size:22px; line-height:28px; font-weight:700; color:#141824; text-align:right;">{{metric_value}}</td>
                <td style="padding:6px 0 6px 8px; font-size:14px; line-height:20px; font-weight:700; text-align:left; width:25%;">
                  <!-- #1C5A33 positive, #7C1F1F negative, #586F7C neutral -->
                  <span style="color:#1C5A33;">{{delta_text}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

# =============================================================================
# CHART IMAGE (supplemental component — not in canonical_template)
# Use when a workflow attaches a chart PNG via cid: reference.
#
# Source PNG MUST be 1088×N pixels (2× retina); displayed at 544px.
# 544 = 600 (container) − 28 × 2 (body-pad). The width="544" HTML
# attribute is mandatory: Outlook desktop ignores CSS max-width:100%
# on images, which is the #1 cause of "have to scroll right" reports.
# =============================================================================

chart_image_html: |
  <tr>
    <td class="body-pad" style="padding:20px 28px 0 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
        <tr>
          <td style="padding:0 0 8px 0;"><h2 style="margin:0; font-size:12px; line-height:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#586F7C;">{{section_kicker}}</h2></td>
        </tr>
        <tr>
          <td style="padding:0 0 12px 0; text-align:center;">
            <img src="cid:{{chart_cid}}" alt="{{chart_alt}}" width="544" style="display:block; width:544px; max-width:100%; height:auto; border:1px solid #D7DEEE; margin:0 auto;">
          </td>
        </tr>
        <tr>
          <!-- Optional caption — omit the entire <tr> if no caption. -->
          <td style="font-size:12px; line-height:17px; color:#586F7C; padding:0 0 4px 0;">{{chart_caption}}</td>
        </tr>
      </table>
    </td>
  </tr>

# Chart brand colors. A chart
# MUST use only the colors below; anything else reads as off-brand
# next to the rest of the email. Keys are machine-readable so the
# Python chart code can `import yaml` and look them up by name.
chart_colors:
  # Template values: the canonical template's neutral palette, so charts match
  # the default (unbranded) theme. assets/make-palette.py rewrites the hexes
  # below to the client's brand along with the email theme; keep the keys.
  background: "#F4F6FB"        # matches the email's outer body bg, so the chart blends in
  primary_series: "#6262A0"    # the theme's CTA color: historical / actual line
  secondary_series: "#9DA7EF"  # a lighter primary: forecast / projection line (use linestyle="--")
  band_fill: "#EEF3FF"         # confidence-interval shaded region (use alpha=0.5)
  band_edge: "#D7DEEE"         # confidence-interval edge stroke if needed (alpha=0.6)
  grid: "#E6EBF5"              # horizontal gridlines (subtle; xaxis grid OFF)
  axis: "#D7DEEE"              # left + bottom spines and tick marks
  text: "#586F7C"              # all axis labels, tick labels, legend text
  text_strong: "#141824"       # optional in-image annotation; prefer the HTML kicker instead
  positive_marker: "#1C5A33"   # annotation-only: up-trend dot (matches Opportunity callout)
  negative_marker: "#7C1F1F"   # annotation-only: down-trend dot (matches Risk callout)

# Matplotlib rendering contract — the Python protocol code that
# produces the PNG MUST follow this template. rcParams pin the global
# colors and typography; per-call kwargs pin series colors and styles.
#
#   import matplotlib as mpl
#   import matplotlib.pyplot as plt
#
#   mpl.rcParams.update({
#       "figure.facecolor": "#F4F6FB",
#       "axes.facecolor":   "#F4F6FB",
#       "axes.edgecolor":   "#D7DEEE",
#       "axes.labelcolor":  "#586F7C",
#       "axes.titlecolor":  "#141824",
#       "xtick.color":      "#586F7C",
#       "ytick.color":      "#586F7C",
#       "grid.color":       "#E6EBF5",
#       "grid.linewidth":   0.8,
#       "legend.frameon":   False,
#       "font.family":      "DejaVu Sans",   # ships with matplotlib; brand-safe sans fallback
#       "font.size":        9,
#   })
#
#   fig, ax = plt.subplots(figsize=(5.44, 2.2), dpi=200)   # → 1088×440 PNG
#
#   # Historical / actual series (solid, primary brand color)
#   ax.plot(hist_dates, hist_values,
#           color="#6262A0", linewidth=1.8,
#           marker="o", markersize=4,
#           markerfacecolor="#6262A0", markeredgecolor="#6262A0",
#           label="Actual")
#
#   # Forecast series (dashed, accent color)
#   ax.plot(fc_dates, fc_values,
#           color="#9DA7EF", linewidth=1.8, linestyle="--",
#           marker="o", markersize=4,
#           markerfacecolor="#9DA7EF", markeredgecolor="#9DA7EF",
#           label="Forecast")
#
#   # Confidence band (translucent lavender fill)
#   ax.fill_between(fc_dates, fc_low, fc_high,
#                   color="#D7DEEE", alpha=0.5, linewidth=0,
#                   label="Confidence band")
#
#   # Spines: hide top + right, keep left + bottom in border color
#   ax.spines["top"].set_visible(False)
#   ax.spines["right"].set_visible(False)
#   ax.spines["left"].set_color("#D7DEEE")
#   ax.spines["bottom"].set_color("#D7DEEE")
#
#   # Grid: horizontal only, behind data
#   ax.yaxis.grid(True)
#   ax.xaxis.grid(False)
#   ax.set_axisbelow(True)
#
#   # Ticks: align to data dates (MANDATORY — fixes the "drifted x-axis" bug)
#   ax.set_xticks(all_dates)
#   ax.set_xticklabels([d.strftime("%b %-d") for d in all_dates],
#                      rotation=0, fontsize=8)
#   ax.tick_params(axis="both", length=0)    # drop tick marks, keep labels
#
#   # Currency-formatted y-axis with no $0 clutter on the bottom edge
#   ax.yaxis.set_major_formatter(
#       mpl.ticker.FuncFormatter(lambda v, _: f"${v/1000:,.0f}k")
#   )
#
#   ax.legend(loc="upper left", fontsize=8, labelcolor="#586F7C")
#
#   plt.savefig(buf, format="png", dpi=200, bbox_inches="tight",
#               facecolor=fig.get_facecolor())

# =============================================================================
# SHARE-OF-TOTAL BAR (supplemental component — table cell pattern)
# Renders a proportional horizontal bar plus the numeric percentage
# inside a single <td> of a .data-table. Uses nested tables (not
# <div>) so Outlook respects the bar width.
# =============================================================================

share_of_total_bar_html: |
  <!-- This is the INNER content of a <td>. The enclosing <td> still
       carries the data-table cell styling (background, padding, etc.)
       and the column width on its <th> determines the bar's max width. -->
  <span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Share of Total</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
    <tr>
      <td bgcolor="#E6EBF5" style="background-color:#E6EBF5; height:8px; line-height:8px; font-size:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;" width="{{share_pct_int}}%">
          <tr>
            <td bgcolor="#7272AB" style="background-color:#7272AB; height:8px; line-height:8px; font-size:0;">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <div style="font-size:12px; line-height:16px; color:#586F7C; margin-top:4px;">{{share_pct_label}}</div>

# Substitution values for share_of_total_bar_html:
#   {{share_pct_int}}   : integer 0-100, drives the bar width (e.g. 63 for 63.6%).
#   {{share_pct_label}} : display string (e.g. "63.6%"). Render exactly one decimal.

# =============================================================================
# RENDERING
# Follow these steps in order.
# =============================================================================

rendering:
  # Hand-built path. Prefer render_email (see rules); follow these steps only
  # for a section no render_email block can express.
  build:
    - Load this file for canonical_template and rules.
    - "Resolve theme: the default is themes.default below. Load
      protocols/email_styles/themes/<theme_id>.yaml."
    - Identify which sections the workflow requires (e.g. required_sections_in_order).
    - "Build HTML: (a) copy HEAD + outer structure verbatim, (b) copy HEADER +
      STATUS BAR and substitute {{placeholders}}, deleting the header's LOGO
      cell (no logo file is available to a hand-built email) and the
      ' &middot; {{date_range}}' separator when there is no period, (c) compose body from pattern
      components to match workflow sections, (d) add CTA only if workflow
      requests it, (e) add FOOTER."
    - Apply theme color_overrides as literal hex find-replace (case-insensitive)
      to the assembled HTML, including any component snippets you copied in.
    - Strip all HTML comments.
    - Remove every data-preview attribute.
  verify:
    - No {{...}} or ${...} tokens remain.
    - No example data from the template remains.
    - No data-preview attribute remains.
    - One HTML document — no duplicate rendering.
    - Every data-table tbody <td> has a mobile-label span.
    - No internal implementation details visible to recipient (see privacy below).
  send:
    - "If HTML > 50 KB, write it to a file in your working directory (the run workspace) and pass its ABSOLUTE path as content_file=. Never /tmp: the sandbox's /tmp is not visible to the mail server, and a rejected path names the readable roots."
    - "Call mcp_ses_outbound_send_email with content_type='text/html'."

# =============================================================================
# THEMES
# Hex find-replace maps applied to the assembled email HTML (canonical_template
# sections and any component snippets copied into it).
# See protocols/email_styles/README.md for the full palette-to-role mapping
# and instructions on creating new themes.
# =============================================================================

themes:
  dir: "protocols/email_styles/themes"
  default: "default"
  discovery: "List themes.dir — each .yaml filename stem is a theme_id."

# =============================================================================
# CONSTRAINTS
# =============================================================================

constraints:
  layout:
    - "Table-first layout for all structural regions — no flex/grid."
    - "No external CSS, scripts, web fonts, forms, iframe, video, or canvas."
    - "Single-column body, 600px max-width."
  css:
    safe: "background-color, color, font-family, font-size, font-weight, line-height,
           padding, margin, border, border-collapse, text-align, vertical-align,
           width, max-width, text-transform, letter-spacing, display:inline-block"
    avoid: "Gradients, box shadows, opacity-dependent text, background images,
            position-based layout, rounded corners on Outlook containers,
            relying on dark-mode inversion for contrast."
  colors:
    - "Explicit inline text + background colors on every critical block."
    - "Dark header + light body by default. No transparent backgrounds on text."
    - "Prefer off-whites (#F4F6FB, #FAFAFA) over #FFFFFF; dark greys (#141824) over #000."
    - "Contrast: 4.5:1 normal text, 3.0:1 large text."
  privacy:
    rule: "Email body MUST NOT expose internal details — no theme names,
           no mail-tool names, no 'MCP', no agent reasoning or instruction-conflict notes."
    allowed: "'Generated by Victoria' in footer and brand names as identity."
  attachments:
    max_per_file_mb: 25
    max_total_mb: 30

# =============================================================================
# CANONICAL TEMPLATE
#
# MIRRORED from the email design system — do not hand-edit.
#
# This is a PATTERN REFERENCE with sample data. Each section is marked with
# an HTML comment header (e.g. <!-- HEADER -->) matching the components table
# above. The agent copies fixed sections verbatim and uses pattern sections
# as building blocks.
# =============================================================================

canonical_template: |
  <!DOCTYPE html>
  <html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
    <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <title>Email-Safe Theme Reference</title>
      <!--[if mso]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:AllowPNG/>
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
      <![endif]-->
      <style>
        /* Mobile-responsive overrides — email clients that support <style> */
        @media only screen and (max-width: 480px) {
          .email-container { width: 100% !important; max-width: 100% !important; }
          .header-pad, .body-pad, .footer-pad { padding-left: 16px !important; padding-right: 16px !important; }
          .status-pad { padding-left: 16px !important; padding-right: 16px !important; }
          .table-pad { padding-left: 12px !important; padding-right: 12px !important; }
          .header-kicker, .header-date { font-size: 11px !important; }
          .header-brand { font-size: 21px !important; line-height: 26px !important; }
          .header-logo img { width: auto !important; height: auto !important; max-width: 132px !important; max-height: 36px !important; }
          .header-meta { font-size: 13px !important; line-height: 19px !important; }
          .mobile-stack { display: block !important; width: 100% !important; box-sizing: border-box !important; margin-bottom: 8px !important; }
          .mobile-stack:last-child { margin-bottom: 0 !important; }
          .data-table { width: 100% !important; max-width: 100% !important; border: 0 !important; border-collapse: separate !important; border-spacing: 0 !important; table-layout: fixed !important; }
          .data-table thead { display: none !important; }
          .data-table tbody, .data-table tr, .data-table td { display: block !important; width: 100% !important; }
          .data-table tr { width: 100% !important; margin-bottom: 12px !important; }
          .data-table tr:last-child { margin-bottom: 0 !important; }
          .data-table td { box-sizing: border-box !important; background-color: #FAFAFA !important; font-size: 15px !important; line-height: 20px !important; padding: 8px 10px !important; text-align: left !important; white-space: normal !important; word-break: break-word !important; border-left: 1px solid #D7DEEE !important; border-right: 1px solid #D7DEEE !important; border-bottom: 1px solid #E6EBF5 !important; }
          .data-table td:first-child { border-top: 1px solid #D7DEEE !important; }
          .data-table td:last-child { border-bottom: 0 !important; }
          .data-table tr td:last-child { border-bottom: 1px solid #D7DEEE !important; }
          .data-table .campaign-name { background-color: #EEF3FF !important; font-weight: 700 !important; }
          .data-table td .mobile-label, .mobile-label { display: block !important; min-width: 0 !important; max-height: none !important; overflow: visible !important; font-size: 13px !important; line-height: 18px !important; font-weight: 700 !important; color: #586F7C !important; margin-bottom: 4px !important; }
        }
      </style>
    </head>
    <body style="margin:0; padding:0; background-color:#F4F6FB; color:#141824; font-family:'Segoe UI', Arial, sans-serif; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

      <!-- Preheader: hidden text shown in inbox preview after subject line -->
      <div style="display:none; mso-hide:all; visibility:hidden; font-size:1px; color:#F4F6FB; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden;">
        {{preheader_text}} &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
      </div>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F6FB" style="width:100%; border-collapse:collapse; background-color:#F4F6FB; margin:0; padding:0;">
        <tr>
          <td align="center" style="padding:24px 12px;">
            <!--[if mso]>
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td>
            <![endif]-->
            <table class="email-container" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FAFAFA" style="width:100%; max-width:600px; border-collapse:collapse; background-color:#FAFAFA; border:1px solid #D7DEEE;">

              <!-- ============================================
                   HEADER: Dark branded header block. A small
                   Victoria line and the date, then the client's
                   logo and name, then a short headline with the
                   period it covers.
                   ============================================ -->
              <!-- Accent stripe: a filled 4px row, not a border-top on the header cell (Outlook drops single-side td borders) -->
              <tr>
                <td height="4" bgcolor="#7272AB" style="height:4px; line-height:4px; mso-line-height-rule:exactly; font-size:1px; background-color:#7272AB; padding:0;">&nbsp;</td>
              </tr>
              <tr>
                <td class="header-pad" bgcolor="#1A0B1E" style="background-color:#1A0B1E; padding:22px 28px 24px 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                    <tr>
                      <td class="header-kicker" style="font-size:12px; line-height:16px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#D2D9DE; padding:0 0 14px 0;">Victoria | Campaign Intelligence</td>
                      <td class="header-date" data-preview="date" align="right" style="font-size:12px; line-height:16px; color:#BEB6CD; padding:0 0 14px 12px; white-space:nowrap;">{{date}}</td>
                    </tr>
                    <tr>
                      <td colspan="2" style="padding:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                          <tr>
                            <!-- LOGO: render_email sizes this from the bundle's assets/email-logo.png and returns the file to attach as cid:brand-logo. A hand-built email deletes this whole cell. -->
                            <td class="header-logo" valign="middle" style="padding:0 14px 0 0;"><img src="cid:brand-logo" width="44" height="44" alt="" style="display:block; width:44px; height:44px; border:0; outline:none; text-decoration:none;"></td>
                            <td valign="middle" style="padding:0;"><h1 class="header-brand" data-preview="client" style="margin:0; font-size:26px; line-height:32px; font-weight:700; letter-spacing:-0.01em; color:#FAFAFA;">{{client_name}}</h1></td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <!-- META: a short headline and the period it covers ("Weekly delivery review &middot; Oct 13 - Oct 19"); drop the separator and period when there is none -->
                    <tr>
                      <td class="header-meta" data-preview="meta" colspan="2" style="font-size:15px; line-height:22px; color:#D2D9DE; padding:12px 0 0 0;"><strong style="font-weight:600; color:#FAFAFA;">{{email_headline}}</strong> &middot; {{date_range}}</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   STATUS BAR: Badge + inline status
                   The inner <table> MUST close here (line below).
                   If body rows land inside this table, column-count
                   mismatch creates a visible blank gap on the right.
                   ============================================ -->
              <!-- Hairline above the status bar (filled 1px row) -->
              <tr>
                <td height="1" bgcolor="#D7DEEE" style="height:1px; line-height:1px; mso-line-height-rule:exactly; font-size:1px; background-color:#D7DEEE; padding:0;">&nbsp;</td>
              </tr>
              <tr>
                <td class="status-pad" bgcolor="#EEF3FF" style="background-color:#EEF3FF; padding:12px 28px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td bgcolor="#6262A0" style="background-color:#6262A0; color:#FAFAFA; font-size:12px; line-height:16px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:4px 10px; border:1px solid #6262A0;">{{badge_label}}</td>
                      <td style="padding-left:8px; font-size:13px; line-height:18px; color:#33415F;">Status: {{status}}</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <!-- Hairline below the status bar (filled 1px row) -->
              <tr>
                <td height="1" bgcolor="#D7DEEE" style="height:1px; line-height:1px; mso-line-height-rule:exactly; font-size:1px; background-color:#D7DEEE; padding:0;">&nbsp;</td>
              </tr>

              <!-- ============================================
                   BODY: Executive summary content
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:28px 28px 0 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                    <tr>
                      <td style="padding:0 0 8px 0;"><h2 style="margin:0; font-size:12px; line-height:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#586F7C;">Executive Summary</h2></td>
                    </tr>
                    <tr>
                      <td data-preview="summary-1" style="font-size:16px; line-height:24px; color:#141824; padding:0 0 12px 0;">Spend finished at <strong>$589,075.45</strong>, down <strong style="color:#7C1F1F;">12.4%</strong> week over week, driven primarily by Example US Video pacing cuts that began on Apr 3.</td>
                    </tr>
                    <tr>
                      <td data-preview="summary-2" style="font-size:16px; line-height:24px; color:#141824; padding:0 0 12px 0;">The biggest production risk is continued weekend underdelivery across the portfolio. The best immediate opportunity is recovering volume in stable Canada inventory where CPMs held while spend softened.</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   METRICS CARD: Key figures block
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:20px 28px 0 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F6FB" style="width:100%; border-collapse:collapse; background-color:#F4F6FB; border:1px solid #D7DEEE;">
                    <tr>
                      <td style="padding:16px 18px 6px 18px;"><h2 style="margin:0; font-size:12px; line-height:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#586F7C;">Topline Metrics</h2></td>
                    </tr>
                    <tr>
                      <td data-preview="metrics" style="padding:0 18px 16px 18px; font-size:16px; line-height:24px; color:#141824;">
                        <strong>Gross Spend:</strong> $589,075.45<br>
                        <strong>Impressions:</strong> 63,400,529<br>
                        <strong>Average CPM:</strong> $9.29
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   CALLOUT: Risk (warning pattern)
                   Accent #FFB86C aligns with flag color.warning.
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:20px 28px 0 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFF5E5" style="width:100%; border-collapse:collapse; background-color:#FFF5E5; border-left:4px solid #FFB86C; border-top:1px solid #F5DDB5; border-right:1px solid #F5DDB5; border-bottom:1px solid #F5DDB5;">
                    <tr>
                      <td style="padding:14px 16px 6px 16px;"><h2 style="margin:0; font-size:16px; line-height:24px; font-weight:700; color:#8C5A18;">Risk</h2></td>
                    </tr>
                    <tr>
                      <td data-preview="risk-body" style="padding:0 16px 14px 16px; font-size:16px; line-height:24px; color:#141824;">Example US Video weekend spend fell to roughly $755/day after pacing above $104,000/day earlier in the week.</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   CALLOUT: Opportunity (success pattern)
                   Accent #50FA7B aligns with flag color.success.
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:16px 28px 0 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EFFAF3" style="width:100%; border-collapse:collapse; background-color:#EFFAF3; border-left:4px solid #50FA7B; border-top:1px solid #CDEDD8; border-right:1px solid #CDEDD8; border-bottom:1px solid #CDEDD8;">
                    <tr>
                      <td style="padding:14px 16px 6px 16px;"><h2 style="margin:0; font-size:16px; line-height:24px; font-weight:700; color:#1C5A33;">Opportunity</h2></td>
                    </tr>
                    <tr>
                      <td data-preview="opportunity-body" style="padding:0 16px 14px 16px; font-size:16px; line-height:24px; color:#141824;">Canada display inventory stayed efficient, creating room to shift spend without increasing blended CPM.</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   DATA TABLE: Campaign comparison
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:20px 28px 0 28px;"><h2 style="margin:0; font-size:12px; line-height:17px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#586F7C;">Campaign Table</h2></td>
              </tr>
              <tr>
                <td class="table-pad" style="padding:8px 28px 0 28px;">
                  <table class="data-table" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse; border:1px solid #D7DEEE; table-layout:fixed;">
                    <thead>
                      <tr>
                        <th scope="col" align="left"  width="40%" bgcolor="#EEF3FF" style="background-color:#EEF3FF; color:#33415F; font-size:13px; line-height:18px; font-weight:700; padding:10px 8px; word-break:break-word;">Campaign</th>
                        <th scope="col" align="right" width="22%" bgcolor="#EEF3FF" style="background-color:#EEF3FF; color:#33415F; font-size:13px; line-height:18px; font-weight:700; padding:10px 8px;">Current</th>
                        <th scope="col" align="right" width="22%" bgcolor="#EEF3FF" style="background-color:#EEF3FF; color:#33415F; font-size:13px; line-height:18px; font-weight:700; padding:10px 8px;">Prior</th>
                        <th scope="col" align="right" width="16%" bgcolor="#EEF3FF" style="background-color:#EEF3FF; color:#33415F; font-size:13px; line-height:18px; font-weight:700; padding:10px 8px;">WoW</th>
                      </tr>
                      <!-- Header/body separator: a filled 1px row, not border-bottom on the header cells. Kept even though the default fills differ: a theme may map the header and first-row fills to the same hex. colspan MUST equal the column count. -->
                      <tr>
                        <td colspan="4" height="1" bgcolor="#D7DEEE" style="height:1px; line-height:1px; mso-line-height-rule:exactly; font-size:1px; background-color:#D7DEEE; padding:0;">&nbsp;</td>
                      </tr>
                    </thead>
                    <tbody data-preview="campaign-table-body">
                      <tr>
                        <td class="campaign-name" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px; word-break:break-word;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Campaign</span>Example US Video</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Current</span>$311,402</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Prior</span>$405,928</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#7C1F1F; font-size:15px; line-height:22px; font-weight:700; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden; color:#586F7C;">WoW</span>-23.3%</td>
                      </tr>
                      <tr>
                        <td class="campaign-name" bgcolor="#F4F6FB" style="background-color:#F4F6FB; color:#141824; font-size:15px; line-height:22px; padding:10px 8px; word-break:break-word;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Campaign</span>Example CA Display</td>
                        <td align="right" bgcolor="#F4F6FB" style="background-color:#F4F6FB; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Current</span>$72,119</td>
                        <td align="right" bgcolor="#F4F6FB" style="background-color:#F4F6FB; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Prior</span>$68,004</td>
                        <td align="right" bgcolor="#F4F6FB" style="background-color:#F4F6FB; color:#1C5A33; font-size:15px; line-height:22px; font-weight:700; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden; color:#586F7C;">WoW</span>+6.1%</td>
                      </tr>
                      <tr>
                        <td class="campaign-name" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px; word-break:break-word;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Campaign</span>Sample Brand Display</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Current</span>$54,882</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#141824; font-size:15px; line-height:22px; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden;">Prior</span>$58,131</td>
                        <td align="right" bgcolor="#FAFAFA" style="background-color:#FAFAFA; color:#7C1F1F; font-size:15px; line-height:22px; font-weight:700; padding:10px 8px;"><span class="mobile-label" style="display:none; font-size:0; line-height:0; max-height:0; overflow:hidden; color:#586F7C;">WoW</span>-5.6%</td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   CTA: Bulletproof button (optional)
                   ============================================ -->
              <tr>
                <td style="padding:24px 28px 0 28px;" align="center">
                  <!--[if mso]>
                  <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{cta_url}}" style="height:44px; v-text-anchor:middle; width:220px;" arcsize="0%" fillcolor="#6262A0" stroke="f">
                    <v:textbox inset="0,0,0,0">
                      <center style="font-family:'Segoe UI', Arial, sans-serif; font-size:14px; font-weight:700; color:#FAFAFA;">{{cta_text}}</center>
                    </v:textbox>
                  </v:roundrect>
                  <![endif]-->
                  <!--[if !mso]><!-->
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td align="center" bgcolor="#6262A0" style="background-color:#6262A0; padding:12px 32px; border:1px solid #6262A0;">
                        <a data-preview="cta" href="{{cta_url}}" target="_blank" style="font-family:'Segoe UI', Arial, sans-serif; font-size:16px; line-height:20px; font-weight:700; color:#FAFAFA; text-decoration:none; display:inline-block;">{{cta_text}}</a>
                      </td>
                    </tr>
                  </table>
                  <!--<![endif]-->
                </td>
              </tr>

              <!-- ============================================
                   CLOSING: Next steps / outlook
                   ============================================ -->
              <tr>
                <td class="body-pad" style="padding:24px 28px 28px 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                    <tr>
                      <td style="font-size:16px; line-height:24px; color:#33415F;"><h2 style="margin:0 0 8px 0; font-size:16px; line-height:24px; font-weight:700; color:#33415F;">Outlook &amp; Next Steps</h2>Hold the dark header plus white-body structure, keep all critical colors explicit inline, and use only table-safe blocks when this reference is adapted for production emails.</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- ============================================
                   FOOTER: Default — include as-is unless the
                   workflow or operator requests changes.
                   ============================================ -->
              <!-- Hairline above the footer (filled 1px row) -->
              <tr>
                <td height="1" bgcolor="#D7DEEE" style="height:1px; line-height:1px; mso-line-height-rule:exactly; font-size:1px; background-color:#D7DEEE; padding:0;">&nbsp;</td>
              </tr>
              <tr>
                <td class="footer-pad" bgcolor="#F4F6FB" style="background-color:#F4F6FB; padding:16px 28px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-collapse:collapse;">
                    <tr>
                      <td style="font-size:13px; line-height:18px; color:#5C6A87; text-align:center;">Generated by Victoria</td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
            <!--[if mso]>
            </td></tr></table>
            <![endif]-->
          </td>
        </tr>
      </table>
    </body>
  </html>
